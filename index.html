<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viyella</title>
  <meta name="description" content="Viyella 的个人主页">
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e6e8ee;
      --muted: #8b93a7;
      --accent: #4f8cff;
      --border: #262b36;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.7;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem;
      max-width: 560px;
      width: 100%;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: var(--accent);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .bio {
      color: var(--muted);
      font-size: 0.98rem;
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .links a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      font-size: 0.9rem;
      transition: all 0.15s ease;
    }
    .links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Viyella</h1>
    <!-- 副标题：一句话定位自己，如「独立开发者 / 数字游民」 -->
    <p class="subtitle">你好，世界。</p>

    <!-- 自我介绍：改成你自己的介绍 -->
    <p class="bio">
      这里是 viyella0721.com，一个刚上线的个人主页。
      内容正在建设中，敬请期待。
    </p>

    <!-- 链接区：把 # 换成你的真实链接，不需要的整行删掉 -->
    <div class="links">
      <a href="https://github.com/你的用户名" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:you@example.com">Email</a>
      <a href="#" target="_blank" rel="noopener">Blog</a>
    </div>

    <footer>© 2026 Viyella · Powered by GitHub Pages</footer>
  </main>
</body>
</html>
