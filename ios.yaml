# ============================================
# Viyella iOS 配置（Stash / Clash 兼容）
# 场景：英国 → 回国（国内网站走回国节点，国外网站直连）
# 更新时间：2026-08-23
# ============================================
mixed-port: 7890
mode: rule
log-level: warning
ipv6: false

proxies:
  # ---------- 回国直连：hysteria2（主力，快） ----------
  - name: "EZIO-CHINA"
    type: hysteria2
    server: 106.55.43.103
    port: 443
    password: "04be55b392ebe1132ed5e55aa6790e0b"
    sni: www.bing.com
    skip-cert-verify: true
    obfs: salamander
    obfs-password: "d3213492b477c48875bc23fab696b262"

  # ---------- 回国 CDN：VLESS+WS 走 Cloudflare（备用，伪装） ----------
  - name: "CN-CDN"
    type: vless
    server: cn.viyella0721.com
    port: 2053
    uuid: 1db69de8-5350-4efb-b471-faefd8af4a45
    network: ws
    tls: true
    servername: cn.viyella0721.com
    skip-cert-verify: true
    client-fingerprint: chrome
    ws-opts:
      path: /ede402d78dc2385b
      headers:
        Host: cn.viyella0721.com

  # ---------- 出国直连：VLESS Reality（备用，防英国本地封锁） ----------
  - name: "EZIO"
    type: vless
    server: 95.169.17.131
    port: 2053
    uuid: 2c701d58-450e-4ab3-944b-9579eef0d40a
    network: tcp
    tls: true
    servername: www.apple.com
    flow: xtls-rprx-vision
    reality-opts:
      public-key: hdYBxsdWdNF4-h5TsW_31E2XPKFyXoohCTZFm2BlL3g
      short-id: 225bb975eb3008cf
    client-fingerprint: chrome

  # ---------- 出国 CDN：VLESS+WS 走 Cloudflare（备用） ----------
  - name: "EZIO-CDN"
    type: vless
    server: proxy.viyella0721.com
    port: 443
    uuid: c89a629d-8275-43dc-a291-8cbd4f23528e
    network: ws
    tls: true
    servername: proxy.viyella0721.com
    client-fingerprint: chrome
    ws-opts:
      path: /e44ca0db091056bd
      headers:
        Host: proxy.viyella0721.com

proxy-groups:
  # 回国组：国内网站流量走这里（切 EZIO-CHINA 或 CN-CDN）
  - name: "回国"
    type: select
    proxies:
      - "EZIO-CHINA"
      - "CN-CDN"

  # 出国组：万一需要（英国本地访问国外站请用 DIRECT，更快）
  - name: "出国"
    type: select
    proxies:
      - "EZIO"
      - "EZIO-CDN"

rules:
  # 国内域名 → 回国组
  - GEOSITE,cn,回国
  # 国内 IP → 回国组
  - GEOIP,CN,回国,no-resolve
  # 苹果推送等系统服务直连（英国本地可达）
  - DOMAIN-SUFFIX,apple.com,DIRECT
  - DOMAIN-SUFFIX,icloud.com,DIRECT
  # 自己的服务器和域名直连
  - DOMAIN-SUFFIX,viyella0721.com,DIRECT
  # 其余全部直连（英国本地网络访问国外站本来就快）
  - MATCH,DIRECT

dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback:
    - https://doh.pub/dns-query
